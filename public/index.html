<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta content="text/html;charset=utf-8" http-equiv="content-type" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LogicSim</title>
    <link rel="stylesheet" type="text/css" href="lib/joint.css" />
    <link href="lib/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: {
                            950: "#070b14",
                            900: "#0c1220",
                            800: "#121a2b"
                        }
                    },
                    boxShadow: {
                        inset: "inset 0 2px 8px rgba(2, 6, 23, 0.55)"
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" type="text/css" href="style.css" />

    <script src="lib/jquery.min.js"></script>
    <script src="lib/lodash.min.js"></script>
    <script src="lib/backbone.js"></script>
    <script src="lib/graphlib.min.js"></script>
    <script src="lib/dagre.min.js"></script>
    <script src="lib/joint.js"></script>
    <script src="lib/select2.min.js"></script>
    <script src="LogicParser.js"></script>
</head>

<body class="bg-ink-950 text-slate-200 antialiased">
    <div class="joint-app">
        <aside class="control-panel">
            <div class="px-4 pt-4 pb-3 border-b border-slate-800/80">
                <p class="text-[11px] uppercase tracking-[0.28em] text-cyan-400/80">LogicSim</p>
                <h1 class="mt-1 text-xl font-semibold text-white">逻辑图生成器</h1>
                <p class="mt-1 text-xs text-slate-400">逆波兰表达式 → JSON → JointJS 画布</p>
            </div>

            <div class="mini-map mx-4 mt-4 overflow-hidden rounded-xl border border-cyan-500/30 bg-slate-950">
                <div id="mini-paper"></div>
                <div id="mini-view">
                    <div id="mini-resize"></div>
                </div>
            </div>

            <div class="control-scroll px-4 py-4 space-y-5">
                <section class="space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-medium uppercase tracking-wider text-slate-400" for="ReversePol">逆波兰表达式</label>
                        <span class="text-[10px] text-slate-500">支持 . , &lt; = &gt;</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button"
                            class="rounded-xl border border-cyan-400/30 bg-slate-900 px-3 py-2 text-sm text-cyan-200 transition duration-200 hover:-translate-y-0.5 hover:border-cyan-300 hover:bg-cyan-500/10 hover:shadow-lg hover:shadow-cyan-500/20"
                            onclick="insertQuantifier('∀')">插入全称量词 (∀)</button>
                        <button type="button"
                            class="rounded-xl border border-blue-400/30 bg-slate-900 px-3 py-2 text-sm text-blue-200 transition duration-200 hover:-translate-y-0.5 hover:border-blue-300 hover:bg-blue-500/10 hover:shadow-lg hover:shadow-blue-500/20"
                            onclick="insertQuantifier('∃')">插入存在量词 (∃)</button>
                    </div>
                    <textarea id="ReversePol" spellcheck="false"
                        class="h-24 w-full resize-y rounded-xl border border-slate-700 bg-slate-950/80 px-3 py-2 font-mono text-sm text-slate-100 shadow-inset outline-none ring-0 transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30"
                        placeholder="例如：a b . fe >"></textarea>
                    <button type="button"
                        class="w-full rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-blue-900/40 transition duration-200 hover:-translate-y-0.5 hover:bg-blue-500 hover:shadow-blue-500/40"
                        onclick="app.parseLogic()">解析文本</button>
                </section>

                <section class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <label
                            class="relative flex cursor-pointer items-center justify-center overflow-hidden rounded-xl bg-slate-800 px-3 py-2.5 text-sm font-medium text-slate-100 transition duration-200 hover:-translate-y-0.5 hover:bg-slate-700 hover:shadow-lg hover:shadow-slate-900/50">
                            载入文本
                            <input type="file" id="fileToLoad" class="absolute inset-0 cursor-pointer opacity-0" />
                        </label>
                        <button type="button"
                            class="rounded-xl bg-slate-800 px-3 py-2.5 text-sm font-medium text-slate-100 transition duration-200 hover:-translate-y-0.5 hover:bg-slate-700 hover:shadow-lg hover:shadow-slate-900/50"
                            onclick="app.saveTextAsFile()">保存文本</button>
                    </div>
                    <input id="inputFileNameToSaveAs" value="默认保存名称"
                        class="w-full rounded-xl border border-slate-700 bg-slate-950/80 px-3 py-2 text-sm text-slate-100 shadow-inset outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30" />
                </section>

                <section class="space-y-3">
                    <label class="text-xs font-medium uppercase tracking-wider text-slate-400" for="myModel">图形 JSON</label>
                    <textarea id="myModel" spellcheck="false"
                        class="h-32 w-full resize-y rounded-xl border border-slate-700 bg-slate-950/80 px-3 py-2 font-mono text-xs text-slate-200 shadow-inset outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30">{"nodeArray":[],"linkArray":[]}</textarea>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="LoadButton" type="button"
                            class="rounded-xl bg-blue-600 px-3 py-2.5 text-sm font-semibold text-white transition duration-200 hover:-translate-y-0.5 hover:bg-blue-500 hover:shadow-lg hover:shadow-blue-500/30"
                            onclick="app.load()">文本转图</button>
                        <button id="SaveButton" type="button"
                            class="rounded-xl bg-slate-800 px-3 py-2.5 text-sm font-medium text-slate-100 transition duration-200 hover:-translate-y-0.5 hover:bg-slate-700 hover:shadow-lg hover:shadow-slate-900/50"
                            onclick="app.save()">图转文本</button>
                    </div>
                </section>

                <section class="space-y-3 rounded-xl border border-slate-800 bg-ink-800/60 p-3">
                    <p class="text-xs font-medium uppercase tracking-wider text-slate-400">选中元素</p>
                    <label class="block text-xs text-slate-400" for="ERName">元素名称</label>
                    <input type="text" id="ERName"
                        class="w-full rounded-xl border border-slate-700 bg-slate-950/80 px-3 py-2 text-sm text-slate-100 shadow-inset outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/30" />
                    <label class="block text-xs text-slate-400" for="ERMemo">元素备注</label>
                    <textarea id="ERMemo"
                        class="h-20 w-full resize-y rounded-xl border border-slate-700 bg-slate-950/80 px-3 py-2 text-sm text-slate-100 shadow-inset outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/30"></textarea>
                    <button id="ERSetName" type="button"
                        class="w-full rounded-xl bg-slate-800 px-3 py-2.5 text-sm font-medium text-slate-100 transition duration-200 hover:-translate-y-0.5 hover:bg-slate-700"
                        onclick="app.ChangeName()">保存修改</button>
                </section>

                <section class="rounded-xl border border-slate-800 bg-ink-800/40 p-3 text-xs leading-6 text-slate-400">
                    在文本框内输入逆波兰逻辑表达式，再点「解析文本」，然后点「文本转图」。<br />
                    操作符：<span class="font-mono text-cyan-300">.</span> 与、
                    <span class="font-mono text-cyan-300">,</span> 或、
                    <span class="font-mono text-cyan-300">&lt;</span> 非、
                    <span class="font-mono text-cyan-300">=</span> 等价、
                    <span class="font-mono text-cyan-300">&gt;</span> 推出。<br />
                    示例：<span class="font-mono text-slate-200">a b . fe &gt;</span> 表示「a 与 b 推出了 fe」。
                </section>

                <p id="status" class="rounded-lg border border-slate-800 bg-slate-950/70 px-3 py-2 text-xs text-slate-400">
                    Diagram Model loaded from Json Format.
                </p>
            </div>
        </aside>

        <div class="app-header"></div>

        <div class="app-body">
            <div class="left-container"></div>
            <div class="main-container">
                <div id="paper-container">
                    <div id="paper" style="cursor:grab"></div>
                </div>
            </div>
            <div id="app-resize">
                <div class="resize-toggle" onclick="app.ResizeBlock()"></div>
            </div>
            <div class="right-container"></div>
            <div class="bottom-container"></div>
        </div>
    </div>
    <script>
        function insertQuantifier(symbol) {
            var el = document.getElementById("ReversePol");
            var start = el.selectionStart;
            var end = el.selectionEnd;
            var value = el.value;
            el.value = value.slice(0, start) + symbol + value.slice(end);
            el.focus();
            var caret = start + symbol.length;
            el.setSelectionRange(caret, caret);
        }
    </script>
    <script src="ViewGen.js"></script>
</body>

</html>
